<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | China Bazar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#064e3b' } } } }</script>
</head>
<body class="bg-gray-50">
    <div id="product-details" class="max-w-6xl mx-auto p-4 md:p-12">
        <!-- Details Inject Here -->
    </div>
    <script src="app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        async function loadDetails() {
            const { data }, error = await supabase.from('products').select('*').eq('id', productId).single();
            if(data) {
                document.getElementById('product-details').innerHTML = `
                    <div class="grid md:grid-cols-2 gap-12 bg-white p-8 rounded-3xl shadow-sm">
                        <img src="${data.images[0]}" class="w-full rounded-2xl">
                        <div class="space-y-6">
                            <h1 class="text-4xl font-bold">${data.name}</h1>
                            <p class="text-3xl font-black text-primary">৳ ${data.price}</p>
                            <div class="border-t pt-6">
                                <h4 class="font-bold mb-2">Specifications</h4>
                                <pre class="text-sm text-gray-600 font-sans">${JSON.stringify(data.specifications, null, 2)}</pre>
                            </div>
                            <button onclick="addToCart('${data.id}', '${data.name}', ${data.price}, '${data.images[0]}')" class="w-full bg-primary text-white py-5 rounded-2xl font-bold text-xl">Add to Cart</button>
                        </div>
                    </div>
                `;
            }
        }
        loadDetails();
    </script>
</body>
</html>
