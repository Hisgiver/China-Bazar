<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Admin | China Bazar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#064e3b' } } } }</script>
</head>
<body class="bg-gray-100 flex min-h-screen">
    <aside class="w-64 bg-primary text-white p-6 hidden md:block">
        <h2 class="text-xl font-black mb-8">ADMIN PANEL</h2>
        <nav class="space-y-4 font-bold">
            <a href="#" class="block opacity-100">Products</a>
            <a href="#" class="block opacity-60">Orders</a>
            <a href="#" class="block opacity-60">Customers</a>
        </nav>
    </aside>
    <main class="flex-1 p-8">
        <div class="bg-white p-8 rounded-2xl shadow-sm max-w-4xl">
            <h3 class="text-2xl font-bold mb-6">Add New Product</h3>
            <form id="productForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <input id="pName" placeholder="Product Name" class="p-4 bg-gray-100 rounded-xl" required>
                    <input id="pPrice" type="number" placeholder="Price (৳)" class="p-4 bg-gray-100 rounded-xl" required>
                </div>
                <input id="pImg" placeholder="Image URL (Direct link)" class="w-full p-4 bg-gray-100 rounded-xl" required>
                <textarea id="pDesc" placeholder="Product Description" class="w-full p-4 bg-gray-100 rounded-xl"></textarea>
                <button class="bg-primary text-white px-8 py-4 rounded-xl font-bold">Publish Product</button>
            </form>
        </div>
    </main>
    <script src="app.js"></script>
    <script>
        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('pName').value,
                slug: document.getElementById('pName').value.toLowerCase().replace(/ /g, '-'),
                price: document.getElementById('pPrice').value,
                images: [document.getElementById('pImg').value],
                description: document.getElementById('pDesc').value,
                status: 'active'
            };
            const { error } = await supabase.from('products').insert([payload]);
            if(!error) { alert('Product Added!'); location.reload(); }
        }
    </script>
</body>
</html>
