<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>China Bazar | Premium Gadgets BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#064e3b' }, fontFamily: { sans: ['Inter'], display: ['Poppins'] } } } }
    </script>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white border-b shadow-sm px-4">
        <div class="max-w-7xl mx-auto h-20 flex items-center justify-between">
            <a href="index.html" class="font-display text-2xl font-black text-primary">CHINA<span class="text-black">BAZAR</span></a>
            <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
                <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search gadgets..." class="w-full bg-gray-100 rounded-full py-2 px-6 focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div class="flex items-center space-x-5">
                <a href="admin.html" class="text-xs font-bold text-primary border border-primary px-3 py-1 rounded hidden" id="adminBtn">ADMIN</a>
                <div class="relative cursor-pointer" onclick="toggleCart()">
                    <i data-lucide="shopping-cart"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-primary text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="bg-primary text-white py-16 px-4">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-8 items-center">
            <div class="space-y-6">
                <h1 class="text-5xl font-display font-black leading-tight">Direct Chinese Imports to Bangladesh</h1>
                <p class="text-lg opacity-80">Premium Electronics, Smart Gadgets & Fashion Accessories. Cash on Delivery available.</p>
                <button class="bg-white text-primary px-8 py-4 rounded-full font-bold hover:bg-gray-100">Shop New Arrivals</button>
            </div>
            <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=800" class="rounded-3xl shadow-2xl hidden md:block">
        </div>
    </header>

    <!-- Product Grid -->
    <main class="max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-display font-black mb-8">Featured Products</h2>
        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- Products inject here -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-[100] transform translate-x-full transition-transform p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold">Your Cart</h3>
            <button onclick="toggleCart()"><i data-lucide="x"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-4"></div>
        <div class="border-t pt-4">
            <div class="flex justify-between font-bold mb-4"><span>Total</span><span id="cart-total">৳ 0</span></div>
            <a href="checkout.html" class="block w-full bg-primary text-white text-center py-4 rounded-xl font-bold">Checkout</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
